interface:
  display_name: "Jira Ticket"
  short_description: "Implement or create Jira tickets; sync Ready for Review after PR"
  default_prompt: "Use $jira-ticket to investigate and implement ABC-123 in this repository."
dependencies:
  tools:
    - type: "mcp"
      value: "atlassian"
      description: "Required for Jira and Confluence ticket context and status transitions"
    - type: "mcp"
      value: "datadog"
      description: "Required when the Jira issue references Datadog artifacts"
